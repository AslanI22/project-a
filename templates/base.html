<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        nav a { margin-right: 1rem; color: #0366d6; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        h1 { color: #24292e; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
        .stats { display: flex; gap: 1rem; }
        .stat { flex: 1; text-align: center; }
        .stat b { display: block; font-size: 2rem; color: #0366d6; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.5rem; border-bottom: 1px solid #eee; text-align: left; }
        .done { text-decoration: line-through; color: #999; }
        button { background: #0366d6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0256b3; }
        input, select { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Задачи</a>
        <a href="{{ url_for('tools') }}">Инструменты B</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
